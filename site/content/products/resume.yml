ja:
  name: 職務経歴書AI
  tagline: 応募先ごとに、そのまま出せる職務経歴書を。
  summary: 経歴を一度登録して求人票を貼るだけで、その会社が重視することに合わせた職務経歴書を、A4 に整ったレイアウトの PDF・Word で作ります。履歴書、英文レジュメ、志望動機と面接準備、選考の管理まで。英語・中国語の画面と入力にも対応しています。
  price: 最初の1社無料／5社パック 2,480円・10社パック 3,980円（税込）
  sale:
    price: 5社パック 2,480円、10社パック 3,980円（いずれも税込。1社分＝1つの応募先）
    payment: クレジットカードなど、Stripe の決済画面で選べる方法
    timing: ご購入手続きの完了時
    delivery: お支払いの完了後、すぐに利用枠がアカウントに追加されます
    cancel: デジタルサービスの性質上、購入後のキャンセル・返金はお受けしておりません。当社の責めによる不具合で利用できなかった場合は、お問い合わせください。
    environment: 最新版の Google Chrome、Safari、Microsoft Edge、Firefox（JavaScript を有効にしてください）
  privacy: |
    「職務経歴書AI」（https://resume.flatland.co.jp/）では、次のとおり個人情報を取り扱います。

    - **取得する情報**：アカウント情報（メールアドレス、氏名など、ログインに使う外部アカウントの情報を含む）、利用者が入力した経歴・学歴・資格・転職の希望・求人票・面接の記録、履歴書に記入する氏名・生年月日・住所・電話番号・メールアドレス・写真など、作成した書類、購入の記録。クレジットカード番号などの決済情報は当社では取得せず、決済代行会社（Stripe）が取り扱います。
    - **利用目的**：職務経歴書・履歴書・面接対策などの作成と保存、利用枠の管理、お問い合わせへの対応、不正利用の防止、サービスの改善（個人を識別できない形の統計に限ります）。
    - **AI サービスへの送信**：書類と面接対策を作るため、経歴・求人票・面接の記録などを Anthropic, PBC（米国）の AI サービス「Claude」に送信します。履歴書の住所・電話番号・生年月日・写真は送信しません。Anthropic は送信された内容を AI の学習に使用しないこととしています。
    - **会社の公開情報の調査と求人ページの読み込み**（利用枠を購入した方の機能）：会社の公開情報の調査では、応募先の会社名・職種名・求人票だけを上記の AI サービスに送信し、その検索機能でウェブ検索を行います。経歴など利用者についての情報は送信しません。求人ページの読み込みでは、利用者が入力した URL のページを当社のサーバー（Cloudflare）が取得します。
    - **外国にある第三者への提供・委託**：上記の Anthropic, PBC のほか、ログイン認証に Clerk, Inc.（米国）、データの保存とサーバーの運用に Cloudflare, Inc.（米国）、決済に Stripe（米国の Stripe, Inc. およびその日本法人）を利用しています。AI サービスへの送信は、利用者の同意を得たうえで行います。米国の個人情報保護制度については、個人情報保護委員会が公表している「外国における個人情報の保護に関する制度等の調査」をご覧ください。
    - **保存期間と削除**：保存したデータは、利用者がいつでも削除できます（アカウントの削除）。最後に利用してから1年が経過したデータは自動で削除します。購入の記録は、会計上必要な期間、内容を含まない形で保管します。無料枠の重複利用を防ぐため、メールアドレスから作成した復元できない値を保管します。
en:
  name: Japanese Résumé AI (Shokumu Keirekisho)
  tagline: A Japanese résumé (shokumu keirekisho) tailored to each employer, ready to submit.
  summary: Enter your career once and paste a job posting. It writes a 職務経歴書 matched to what that employer values, laid out neatly on A4 as PDF and Word, plus a 履歴書, an English resume, motivation statement, interview preparation and application tracking. The app has English and Chinese pages, and you can write your input in English or Chinese (https://resume.flatland.co.jp/en/).
  price: First company free; 5 companies ¥2,480, 10 companies ¥3,980 (tax incl.)
  sale:
    price: 5 companies ¥2,480, 10 companies ¥3,980 (tax included; one company = one application)
zh:
  name: 职务经历书 AI
  tagline: 为每一家公司，生成可以直接提交的日文职务经历书。
  summary: 只需登记一次经历、贴上招聘信息，就能按照该公司重视的方向，生成排版整齐的 A4 职务经历书（PDF、Word），以及履历书、英文简历、应聘动机、面试准备和选考管理。有中文界面，可以用中文或英文填写（https://resume.flatland.co.jp/zh/）。
  price: 第一家公司免费；5 家 2,480 日元、10 家 3,980 日元（含税）
  sale:
    price: 5 家 2,480 日元、10 家 3,980 日元（含税；1 家 = 1 个应聘公司）
